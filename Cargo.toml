[package]
name = "vigil-server"
version = "1.29.0"
description = "Microservices Status Page. Monitors a distributed infrastructure and sends alerts (Slack, SMS, etc.). Fork of Vigil by Valerian Saliou."
readme = "README.md"
license = "MPL-2.0"
edition = "2024"
homepage = "https://github.com/SamTV12345/Vigilant"
repository = "https://github.com/SamTV12345/Vigilant.git"
keywords = ["microservices", "infrastructure", "status", "monitor", "slack"]
categories = ["web-programming"]
authors = ["SamTV12345", "Valerian Saliou <valerian@valeriansaliou.name>"]
exclude = ["dev/*"]

[[bin]]
name = "vigil"
path = "src/main.rs"
doc = false

[dependencies]
log = { version = "0.4", features = ["std"] }
clap = { version = "4.6", features = ["std", "cargo"] }
time = { version = "0.3", features = ["formatting"] }
serde = "1.0"
serde_derive = "1.0"
toml = "1.1"
envsubst = "0.2"
uuid = { version = "1.24", features = ["v4", "fast-rng"], default-features = false }
regex = "1.13"
url = { version = "2.5", default-features = false }
url_serde = { version = "0.2", default-features = false }
http = "1.5"
http-serde = "2.1"
indexmap = { version = "2.14", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
tower-http = { version = "0.6", features = ["normalize-path", "auth", "fs"] }
tower = { version = "0.5", features = ["util"] }
rmcp = { version = "3.1", features = ["server", "macros", "base64", "transport-streamable-http-server"], default-features = false }
tera = { version = "2.1", default-features = false }
native-tls = { version = "0.2", features = ["vendored"] }
openssl-probe = "0.2"
reqwest = { version = "0.13", features = ["native-tls-vendored", "gzip", "blocking", "json", "multipart", "form"], default-features = false }
ping = "0.9"
ssh2 = "0.9"
run_script = "0.11"
lettre = { version = "0.11", features = ["smtp-transport", "native-tls", "hostname", "builder"], default-features = false, optional = true }
libstrophe = { version = "0.20", optional = true }

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["notifier-email", "notifier-twilio", "notifier-slack", "notifier-zulip", "notifier-telegram", "notifier-pushover", "notifier-gotify", "notifier-matrix", "notifier-webex", "notifier-webhook"]
notifier-email = ["lettre"]
notifier-twilio = []
notifier-slack = []
notifier-zulip = []
notifier-telegram = []
notifier-pushover = []
notifier-gotify = []
notifier-matrix = []
notifier-webex = []
notifier-webhook = []
notifier-xmpp = ["libstrophe"]

[profile.dev]
opt-level = 0
debug = true
debug-assertions = true

[profile.release]
opt-level = "s"
lto = true
debug = false
debug-assertions = false
panic = "abort"
strip = true
