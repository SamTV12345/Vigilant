on: [push, pull_request]

name: Test and Build

jobs:
  # ---- Rust backend ----
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust-toolchain: [stable]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache build artifacts
        id: cache-cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: rustfmt
          override: true

      - name: Install build headers (Linux)
        run: sudo apt-get install -y libstrophe-dev
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Verify versions
        run: rustc --version && rustup --version && cargo --version

      - name: Build code (default features)
        run: cargo build
        if: ${{ matrix.os != 'ubuntu-latest' }}

      - name: Build code (all features)
        run: cargo build --all-features
        if: ${{ matrix.os == 'ubuntu-latest' }}

      - name: Test code
        run: cargo test

      - name: Check code style
        run: cargo fmt -- --check

  # ---- Frontend (Playwright browser tests) ----
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install chromium --with-deps

      - name: Run frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Type-check frontend
        working-directory: frontend
        run: pnpm exec tsc --noEmit
